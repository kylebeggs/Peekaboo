<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="pageShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#9a3412" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>

    <!-- face rising behind the page -->
    <circle cx="512" cy="400" r="170" fill="#fb923c"/>
    <ellipse cx="447" cy="318" rx="44" ry="48" fill="#ffffff"/>
    <ellipse cx="577" cy="318" rx="44" ry="48" fill="#ffffff"/>
    <circle cx="447" cy="330" r="21" fill="#1e293b"/>
    <circle cx="577" cy="330" r="21" fill="#1e293b"/>
    <circle cx="455" cy="322" r="7" fill="#ffffff"/>
    <circle cx="585" cy="322" r="7" fill="#ffffff"/>

    <!-- page -->
    <rect x="302" y="382" width="420" height="460" rx="28" fill="#ffffff" filter="url(#pageShadow)"/>

    <!-- markdown content -->
    <rect x="342" y="470" width="220" height="30" rx="15" fill="#94a3b8"/>
    <rect x="342" y="540" width="340" height="22" rx="11" fill="#cbd5e1"/>
    <rect x="342" y="590" width="300" height="22" rx="11" fill="#cbd5e1"/>
    <rect x="342" y="640" width="330" height="22" rx="11" fill="#cbd5e1"/>

    <!-- M-down badge -->
    <rect x="540" y="700" width="142" height="88" rx="18" fill="#fb923c"/>
    <polyline points="566,768 566,722 592,750 618,722 618,768" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="650" y1="722" x2="650" y2="750" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <polygon points="632,748 668,748 650,772" fill="#ffffff"/>
  </g>
</svg>
